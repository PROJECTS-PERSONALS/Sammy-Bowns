# Blueprint de Render para el backend de Sammy Bowns (plan gratis).
# En Render: New > Blueprint > elige este repositorio. Pedirá los valores
# marcados con sync: false. Los datos y las fotos viven en MongoDB Atlas,
# porque el plan gratis de Render borra sus archivos en cada reinicio.
services:
  - type: web
    name: sammy-bowns-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://projects-personals.github.io
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
